services:
  water-meter-api:
    build: .
    image: water-meter-reconciliation:1.0.0
    container_name: water-meter-reconciliation
    # 宿主机端口:容器端口；如本机 8000 被占用，可改为 "8080:8000"
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      # uvicorn 监听端口（与 Dockerfile EXPOSE 保持一致即可）
      PORT: "8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
